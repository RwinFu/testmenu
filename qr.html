<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f2e9">
  <title>QR منوی کافه رُست</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="qr-page">
  <main class="qr-panel">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">ر</span>
      <span>کافه رُست</span>
    </a>
    <h1>منو، همیشه دمِ دست.</h1>
    <p>این کد را با دوربین گوشی اسکن کن؛ منو باز می‌شود و می‌توانی همان‌جا سفارش بدهی.</p>
    <div class="qr-code-wrap">
      <img src="qr-menu.svg" alt="کد QR منوی دیجیتال کافه رُست" width="216" height="216">
    </div>
    <a class="qr-address" href="https://rwinfu.github.io/testmenu/">https://rwinfu.github.io/testmenu/</a>
    <p class="qr-table-note"><span aria-hidden="true">✦</span> برای هر میز یک نسخه چاپ کن و شمارهٔ میز را رویش بنویس.</p>
    <div class="qr-actions">
      <button class="btn btn-dark" id="print-button" type="button">چاپ QR</button>
      <a class="btn btn-outline" href="index.html">دیدن منو</a>
    </div>
    <p class="qr-caption">برای نتیجهٔ بهتر، کد را روی کاغذ روشن و با کنتراست بالا چاپ کن.</p>
  </main>
  <script src="qr.js" defer></script>
</body>
</html>
